<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Koshyk · Redesign v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="tokens.css" />
<style>
  /* Page chrome */
  .canvas-wrap { padding: 56px 32px 120px; max-width: 1480px; margin: 0 auto; }
  .canvas-section { margin: 0 auto 72px; }
  .canvas-section + .canvas-section { border-top: 1px dashed var(--border-strong); padding-top: 64px; }

  .sec-eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-subtle); margin: 0 0 8px; }
  .sec-title { font-family: var(--font-display); font-size: 34px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 6px; color: var(--text); }
  .sec-subtitle { color: var(--text-muted); margin: 0 0 32px; max-width: 64ch; line-height: 1.55; }

  /* DS grid */
  .ds-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px; }
  .ds-card { grid-column: span 4; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-2xl); padding: 24px; box-shadow: var(--sh-1); }
  .ds-card.wide { grid-column: span 6; }
  .ds-card.full { grid-column: span 12; }
  .ds-card h3 { font-family: var(--font-display); font-size: 16px; font-weight: 600; margin: 0 0 4px; }
  .ds-card .meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-subtle); margin: 0 0 16px; }

  /* Swatches */
  .swatch-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .swatch { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: var(--r-md); }
  .swatch-chip { width: 44px; height: 44px; border-radius: var(--r-md); border: 1px solid var(--border); flex-shrink: 0; }
  .swatch-meta { display: flex; flex-direction: column; min-width: 0; }
  .swatch-name { font-size: 13px; font-weight: 500; color: var(--text); }
  .swatch-val { font-family: var(--font-mono); font-size: 11px; color: var(--text-subtle); }

  .scale-row { display: flex; gap: 4px; align-items: stretch; }
  .scale-step { flex: 1; padding: 12px 0 8px; text-align: center; border-radius: var(--r-sm); }
  .scale-label { font-family: var(--font-mono); font-size: 10px; color: var(--text-subtle); display: block; margin-top: 4px; }

  /* Type ramp */
  .type-row { display: flex; align-items: baseline; gap: 24px; padding: 18px 0; border-bottom: 1px solid var(--border); }
  .type-row:last-child { border-bottom: none; }
  .type-row .label { font-family: var(--font-mono); font-size: 11px; color: var(--text-subtle); width: 110px; flex-shrink: 0; }
  .type-row .sample { color: var(--text); }

  /* Radii / shadows */
  .radii-row { display: flex; gap: 12px; align-items: flex-end; }
  .radii-cell { flex: 1; aspect-ratio: 1; background: var(--surface-2); border: 1px solid var(--border); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; font-family: var(--font-mono); font-size: 10px; color: var(--text-subtle); }

  .shadow-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
  .shadow-cell { aspect-ratio: 1; background: var(--surface); border-radius: var(--r-lg); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; font-family: var(--font-mono); font-size: 10px; color: var(--text-subtle); }
  .shadow-1 { box-shadow: var(--sh-1); } .shadow-2 { box-shadow: var(--sh-2); }
  .shadow-3 { box-shadow: var(--sh-3); } .shadow-4 { box-shadow: var(--sh-4); } .shadow-5 { box-shadow: var(--sh-5); }

  /* Component playground rows */
  .play { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 8px 0; }

  /* === Atomic components (CSS-only, mirroring the JSX semantics) === */

  /* Button */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--font-sans); font-weight: 600; border-radius: var(--r-md); border: 1px solid transparent; cursor: pointer; transition: background var(--t-fast) var(--ease), transform var(--t-fast) var(--ease), box-shadow var(--t-base) var(--ease); user-select: none; }
  .btn:active { transform: scale(0.97); }
  .btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--brand-ring); }
  .btn-sm { height: 32px; padding: 0 12px; font-size: 12px; border-radius: var(--r-sm); }
  .btn-md { height: 40px; padding: 0 16px; font-size: 14px; }
  .btn-lg { height: 48px; padding: 0 22px; font-size: 15px; border-radius: var(--r-lg); }
  .btn-xl { height: 56px; padding: 0 26px; font-size: 16px; border-radius: var(--r-lg); width: 100%; }
  .btn-primary { background: var(--brand); color: var(--on-brand); box-shadow: var(--sh-1); }
  .btn-primary:hover { background: var(--brand-hover); box-shadow: var(--sh-brand); }
  .btn-soft { background: var(--brand-soft); color: var(--brand); }
  .btn-soft:hover { background: oklch(from var(--brand-soft) calc(l - 0.03) c h); }
  .btn-secondary { background: var(--surface-2); color: var(--text); border-color: var(--border); }
  .btn-secondary:hover { background: var(--surface-3); }
  .btn-ghost { background: transparent; color: var(--text); }
  .btn-ghost:hover { background: var(--surface-2); }
  .btn-outline { background: transparent; color: var(--text); border-color: var(--border-strong); }
  .btn-outline:hover { background: var(--surface-2); }
  .btn-danger { background: var(--danger); color: white; }
  .btn-danger:hover { filter: brightness(1.05); }

  /* Input */
  .input { height: 40px; width: 100%; padding: 0 12px; font-size: 14px; font-family: var(--font-sans); background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--r-md); outline: none; transition: border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease); }
  .input:hover { border-color: var(--border-strong); }
  .input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-ring); }
  .input.invalid { border-color: var(--danger); }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field-label { font-size: 12px; color: var(--text-muted); font-weight: 500; }
  .field-help { font-size: 11px; color: var(--text-subtle); }
  .field-error { font-size: 11px; color: var(--danger); }

  /* Switch */
  .sw { position: relative; display: inline-block; width: 44px; height: 26px; border-radius: var(--r-full); background: var(--surface-3); border: 1px solid var(--border); cursor: pointer; transition: background var(--t-base) var(--ease); flex-shrink: 0; }
  .sw .thumb { position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: var(--r-full); background: white; box-shadow: var(--sh-1); transition: transform var(--t-base) var(--ease); }
  .sw.on { background: var(--brand); border-color: transparent; }
  .sw.on .thumb { transform: translateX(18px); }
  .sw.sm { width: 34px; height: 20px; }
  .sw.sm .thumb { width: 14px; height: 14px; }
  .sw.sm.on .thumb { transform: translateX(14px); }

  /* Chip */
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: var(--r-full); font-size: 12px; font-weight: 500; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); cursor: pointer; transition: all var(--t-fast) var(--ease); }
  .chip:hover { background: var(--surface-3); }
  .chip.active { background: var(--brand-soft); color: var(--brand); border-color: transparent; }
  .chip .x { width: 12px; height: 12px; }

  /* Badge */
  .badge { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; border-radius: var(--r-full); font-size: 10px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .badge.success { background: var(--success-soft); color: var(--success); }
  .badge.danger { background: var(--danger-soft); color: var(--danger); }
  .badge.warning { background: var(--warning-soft); color: oklch(0.5 0.16 75); }
  .badge.brand { background: var(--brand-soft); color: var(--brand); }

  /* Segmented control */
  .seg { display: inline-flex; padding: 4px; background: var(--surface-2); border-radius: var(--r-md); }
  .seg-item { padding: 6px 14px; font-size: 13px; font-weight: 500; color: var(--text-muted); border-radius: var(--r-sm); cursor: pointer; transition: all var(--t-fast); }
  .seg-item.active { background: var(--surface); color: var(--text); box-shadow: var(--sh-1); }

  /* Card */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-2xl); box-shadow: var(--sh-1); }

  /* Tooltip preview */
  .tip-pop { background: var(--text); color: var(--bg); padding: 8px 12px; border-radius: var(--r-md); font-size: 12px; max-width: 240px; box-shadow: var(--sh-3); }
  .tip-pop::after { content: ""; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%) rotate(45deg); width: 10px; height: 10px; background: var(--text); }

  /* Strength bar */
  .pwbar { display: flex; gap: 4px; margin-top: 6px; }
  .pwbar-seg { flex: 1; height: 4px; border-radius: var(--r-full); background: var(--surface-3); transition: background var(--t-base); }
  .pwbar.s1 .pwbar-seg:nth-child(-n+1) { background: var(--danger); }
  .pwbar.s2 .pwbar-seg:nth-child(-n+2) { background: oklch(0.7 0.18 40); }
  .pwbar.s3 .pwbar-seg:nth-child(-n+3) { background: var(--warning); }
  .pwbar.s4 .pwbar-seg:nth-child(-n+4) { background: var(--success); }

  /* Spinner */
  .spinner { width: 20px; height: 20px; border-radius: var(--r-full); border: 2px solid var(--surface-3); border-top-color: var(--brand); animation: spin 0.7s linear infinite; }
  .spinner.lg { width: 32px; height: 32px; border-width: 3px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Skeleton */
  .skel { background: linear-gradient(90deg, var(--surface-2) 0%, var(--surface-3) 50%, var(--surface-2) 100%); background-size: 200% 100%; animation: shimmer 1.6s infinite; border-radius: var(--r-sm); }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* Avatar */
  .avatar { width: 40px; height: 40px; border-radius: var(--r-full); background: var(--brand-soft); color: var(--brand); display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; }
  .avatar.ring { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--brand); }

  /* Progress ring (CSS) */
  .ring-wrap { width: 88px; height: 88px; position: relative; display: inline-block; }
  .ring-wrap svg { transform: rotate(-90deg); width: 100%; height: 100%; }
  .ring-wrap .ring-bg { stroke: var(--surface-3); }
  .ring-wrap .ring-fg { stroke: var(--brand); transition: stroke-dashoffset var(--t-slow) var(--ease); }
  .ring-wrap .ring-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-weight: 600; font-size: 16px; color: var(--text); }

  /* Bottom sheet preview */
  .sheet-mock { width: 100%; max-width: 380px; background: var(--surface); border-radius: var(--r-2xl) var(--r-2xl) 0 0; box-shadow: var(--sh-4); padding: 12px 20px 24px; border: 1px solid var(--border); border-bottom: none; }
  .sheet-handle { width: 36px; height: 4px; border-radius: var(--r-full); background: var(--border-strong); margin: 4px auto 14px; }

  /* Toast preview */
  .toast { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--sh-3); min-width: 280px; }
  .toast .ico { width: 28px; height: 28px; border-radius: var(--r-sm); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .toast.success .ico { background: var(--success-soft); color: var(--success); }
  .toast.error .ico { background: var(--danger-soft); color: var(--danger); }
  .toast-progress { position: absolute; bottom: 0; left: 0; height: 2px; background: var(--brand); border-radius: 0 0 var(--r-lg) var(--r-lg); animation: tprog 4s linear forwards; }
  @keyframes tprog { from { width: 100%; } to { width: 0%; } }

  /* Date field preview */
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); }
  .cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; font-family: var(--font-mono); border-radius: var(--r-sm); cursor: pointer; color: var(--text); }
  .cal-day.muted { color: var(--text-subtle); }
  .cal-day.today { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
  .cal-day.sel { background: var(--brand); color: var(--on-brand); font-weight: 600; }
  .cal-day:hover:not(.sel) { background: var(--surface-2); }
  .cal-head { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; color: var(--text-subtle); text-align: center; padding: 4px 0; }

  /* Tabs */
  .tabs { display: inline-flex; gap: 4px; border-bottom: 1px solid var(--border); }
  .tab { padding: 10px 16px; font-size: 14px; font-weight: 500; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab.active { color: var(--brand); border-bottom-color: var(--brand); }
  .tabs.pill { border: none; gap: 6px; padding: 4px; background: var(--surface-2); border-radius: var(--r-md); }
  .tabs.pill .tab { border: none; border-radius: var(--r-sm); padding: 6px 14px; }
  .tabs.pill .tab.active { background: var(--surface); color: var(--text); box-shadow: var(--sh-1); }

  /* Empty state */
  .empty { text-align: center; padding: 40px 24px; }
  .empty-illo { width: 72px; height: 72px; border-radius: var(--r-2xl); background: var(--brand-soft); color: var(--brand); display: inline-flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
  .empty h4 { font-family: var(--font-display); font-size: 18px; font-weight: 600; margin: 0 0 6px; }
  .empty p { color: var(--text-muted); font-size: 14px; margin: 0 0 16px; }

  /* Menu */
  .menu { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); padding: 4px; box-shadow: var(--sh-3); min-width: 200px; }
  .menu-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; font-size: 13px; border-radius: var(--r-sm); cursor: pointer; }
  .menu-item:hover { background: var(--surface-2); }
  .menu-item.danger { color: var(--danger); }
  .menu-sep { height: 1px; background: var(--border); margin: 4px 0; }

  /* Number input */
  .numinput { display: inline-flex; align-items: stretch; height: 40px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); overflow: hidden; }
  .numinput button { width: 32px; background: transparent; border: none; cursor: pointer; color: var(--text-muted); font-size: 16px; font-family: var(--font-mono); }
  .numinput button:hover { background: var(--surface-2); color: var(--text); }
  .numinput input { flex: 1; min-width: 80px; height: 100%; border: none; padding: 0 8px; background: transparent; font-family: var(--font-mono); text-align: center; font-size: 14px; color: var(--text); outline: none; }
  .numinput .prefix { display: flex; align-items: center; padding: 0 10px; color: var(--text-subtle); font-family: var(--font-mono); font-size: 13px; background: var(--surface-2); border-right: 1px solid var(--border); }

  /* utilities */
  .row { display: flex; gap: 12px; align-items: center; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .grow { flex: 1; }
  .muted { color: var(--text-muted); }
  .tiny { font-size: 12px; }
  .icon-btn { width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--r-md); background: transparent; border: none; color: var(--text-muted); cursor: pointer; transition: all var(--t-fast); }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="ds-system.jsx"></script>
  <script type="text/babel" src="landing.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="handoff.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
